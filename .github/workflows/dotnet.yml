name: Native .NET

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Security analyzers, dependency audit, and regression tests
        shell: pwsh
        run: ./eng/Test-Security.ps1 -PrepareVeracode
      - run: dotnet pack src/AgentConnector -c Release --no-build -o artifacts/packages
      - run: dotnet publish samples/AgentConnector.Server -c Release --no-build -o artifacts/server
      - name: Preserve security reports and Veracode package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-${{ matrix.os }}
          path: artifacts/security/reports/
          if-no-files-found: error
          retention-days: 14
